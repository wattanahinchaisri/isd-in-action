<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Taco Cloud - Your Cart</title>
  <link rel="stylesheet" th:href="@{/styles.css}" />
</head>
<body>
  <h1>Your Taco Cart</h1>
  <img th:src="@{/images/TacoCloud.png}" alt="Taco Cloud" />

  <div th:if="${#lists.isEmpty(tacoOrder.tacos)}">
    <p>Your cart is currently empty.</p>
    <a th:href="@{/design}">Design your first taco!</a>
  </div>

  <div th:unless="${#lists.isEmpty(tacoOrder.tacos)}">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Taco Name</th>
          <th>Ingredients</th>
          <th>Price</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="taco, stat : ${tacoOrder.tacos}">
          <td th:text="${stat.count}">1</td>
          <td th:text="${taco.name}">My Taco</td>
          <td>
            <span th:each="ing, iterStat : ${taco.ingredients}"
                  th:text="${ing.name} + (${!iterStat.last} ? ', ' : '')">
              Ingredient
            </span>
          </td>
          <td th:text="${#numbers.formatCurrency(taco.price)}">$0.00</td>
          <td>
            <form method="POST" th:action="@{/cart/remove}">
              <input type="hidden" name="index" th:value="${stat.index}" />
              <button type="submit">Remove</button>
            </form>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3"><strong>Total</strong></td>
          <td colspan="2"><strong th:text="${#numbers.formatCurrency(tacoOrder.totalPrice)}">$0.00</strong></td>
        </tr>
      </tfoot>
    </table>

    <div style="margin-top: 20px;">
      <a id="another" th:href="@{/design}">+ Design Another Taco</a> |
      <a id="checkout" th:href="@{/orders/current}">Proceed to Checkout →</a>
    </div>
  </div>
</body>
</html>
